# Service that exposes the CRM pods outside the cluster.
# Reach the CRM at http://<node-ip>:32080/
apiVersion: v1
kind: Service
metadata:
  name: django-crm
  namespace: django-crm
spec:
  # NodePort opens the same fixed port on every node in the cluster
  type: NodePort
  # Send traffic to pods with the label app=django-crm (set in deployment.yaml)
  selector:
    app: django-crm
  ports:
    - name: http
      port: 80        # cluster-internal port
      targetPort: 8000  # containerPort from your Deployment
      nodePort: 32080   # << fixed port on the node (choose 30000–32767)
